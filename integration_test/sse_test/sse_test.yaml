routes:
  - url: "http://sample-sse.test/sse"
    response:
      rewrite: "http://localhost:8092/sse"

  - url: "http://sample-sse.test/sse-with-transform"
    response:
      rewrite: "http://localhost:8092/sse"
      transform: "sed -u -e 's/data/DATA/'"
      headers:
        Content-Type: text/event-stream
      
