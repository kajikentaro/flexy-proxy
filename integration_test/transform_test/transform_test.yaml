log_level: "ERROR"

routes:
  ##########
  # HTTPS
  ##########
  - url: "https://content.test/"
    # expected response is "bar"
    response:
      content: "foo"
      transform: "sed -E 's/foo/bar/g'"

  - url: "https://file.test/"
    # expected response is "baz sample text"
    response:
      file: "sample.txt"
      transform: |
        bash -c "sed -E 's/foo/bar/g' | sed -E 's/bar/baz/g'"

  - url: "https://reverse-proxy.test/"
    response:
      rewrite: "http://localhost:8089/"
      transform: "bash ./wc.sh"

  ##########
  # HTTP
  ##########
  - url: "http://content.test/"
    # expected response is "bar"
    response:
      content: "foo"
      transform: "sed -E 's/foo/bar/g'"

  - url: "http://file.test/"
    # expected response is "baz sample text"
    response:
      file: "sample.txt"
      transform: |
        bash -c "sed -E 's/foo/bar/g' | sed -E 's/bar/baz/g'"

  - url: "http://reverse-proxy.test/"
    response:
      rewrite: "http://localhost:8089/"
      transform: "bash ./wc.sh"

default_route:
  deny_access: true
